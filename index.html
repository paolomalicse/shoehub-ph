<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShoeHub PH</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">ShoeHub PH</div>
    <nav>
        <a href="#">Home</a>
        <a href="#products">Products</a>
        <a href="#" id="cart-btn">Cart (<span id="cart-count">0</span>)</a>
    </nav>
</header>

<section class="hero">
    <h1>Premium Shoes in the Philippines</h1>
    <p>Shop authentic sneakers at the best prices.</p>
    <button>Shop Now</button>
</section>

<section id="products" class="products">
    <h2>Featured Shoes</h2>
    <div class="product-grid" id="product-grid"></div>
</section>

<div class="cart-sidebar" id="cart-sidebar">
    <div class="cart-header">
    <h2>Your Cart</h2>
    <button id="close-cart">✖</button></div>
    <div id="cart-items"></div>
    <h3>Total: ₱<span id="cart-total">0</span></h3>
    <button class="checkout">Checkout</button>
</div>

<script src="script.js"></script>
</body>
</html>
